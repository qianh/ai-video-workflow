[project]
name = "workflow-sidecar"
version = "0.1.0"
description = "Python workflow sidecar for the AI video workstation"
requires-python = ">=3.11"

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
]
build = [
  "pyinstaller>=6.16,<7",
]

[tool.pytest.ini_options]
addopts = "--strict-markers --cov=workflow_sidecar --cov-report=term-missing --cov-fail-under=79"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
branch = true
source = ["workflow_sidecar"]
omit = ["src/workflow_sidecar/__main__.py"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/workflow_sidecar"]
