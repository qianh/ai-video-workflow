[package]
name = "ai-video-workflow-desktop"
version = "0.1.0"
description = "Desktop shell for the AI video workflow"
edition = "2021"

[lib]
name = "ai_video_workflow_desktop"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "ai-video-workflow"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
uuid = { version = "1", features = ["serde", "v7"] }

[dev-dependencies]
tempfile = "3"
